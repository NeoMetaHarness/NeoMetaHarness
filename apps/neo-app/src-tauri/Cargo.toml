[package]
name = "neo-meta-harness"
version = "0.1.0"
description = "Neo Meta Harness desktop shell"
edition = "2024"
rust-version = "1.90"

[lib]
name = "neo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
percent-encoding = "=2.3.2"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.0"
tauri-plugin-deep-link = "=2.4.7"
tauri-plugin-updater = "=2.9.0"
reqwest = { version = "0.12", default-features = false }
url = "2.5"
semver = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

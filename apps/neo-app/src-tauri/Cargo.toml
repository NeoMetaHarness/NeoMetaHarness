[package]
name = "neo-meta-harness"
version = "0.1.0"
description = "Neo Meta Harness desktop shell"
edition = "2024"
rust-version = "1.90"

[lib]
name = "neo_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "=2.12.5", features = ["tray-icon"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Upstream catalog for Neo Meta Harness.
# Engines are consumed unmodified, directly from their SOURCE repos (no personal forks; decision 2026-11-17).
# Sync and bumps run LOCALLY (`neo upstream check|bump`): org guardrail local_only_no_actions, no GitHub Actions.
upstreams:
  deepseek-harness:
    upstream: deepseek-ai/deepseek-harness
    lang: ts
    package: "@deepseek-ai/dsh"
    channel: npm-latest          # developer preview, breaking changes expected
    bump: weekly
    role: [coding-runtime, orchestrator-host]
    seams: [cordis-plugin, profile-patch, acp-profile, sdk-jsonrpc, agent-instructions, computer-use-provider, browser-use-provider, skill]
  dsh-superagent:
    upstream: deepseek-ai/dsh-superagent-prototype
    lang: ts
    channel: main                # research prototype, no releases
    bump: weekly
    role: [orchestrator]
    seams: [cordis-bundle, source-kind, worker-preset-patch]
  hermes-agent:
    upstream: NousResearch/hermes-agent
    lang: py
    channel: stable-release
    bump: nightly
    role: [agent-runtime]
    seams: [api-server-v1, cli, dashboard-backend-api, dashboard-backend-plugin, plugin-loader, memory-provider-plugin, platform-plugin, model-provider-plugin, computer-use, bot-screen, skills-dir, cron, kanban, acp-adapter]
  t3code:
    upstream: pingdotgg/t3code
    lang: ts
    channel: stable-release
    bump: nightly
    role: [coding-control-plane]
    seams: [ws-rpc-orchestration-v2, contracts-schemas-for-validation, auth-session-issue, acp-local-command, mcp-outside-agents]
    consume: server-binary       # client packages are private: Neo ships a thin RPC client, contract-tested (spike a)
  honcho:
    upstream: plastic-labs/honcho
    lang: py
    channel: stable-release
    bump: weekly
    role: [memory-l2]
    seams: [rest-v3, harness-plugin-core-config, hermes-plugin-honcho]
  astryx:
    upstream: meta/astryx
    lang: ts
    package: "@astryxdesign/core"
    channel: npm-latest          # beta
    bump: weekly
    role: [design-system]
    seams: [components, themes-css-vars, cli]
  panda-router:
    upstream: aicodeking/PandaOrchestrator
    lang: py
    channel: main
    bump: weekly
    role: [model-router]
    seams: [mcp-stdio, http-route-escalate-outcome, model-cards-json]
adopted:                         # first-party code derived from upstream; changes copied by hand
  bot-hq:
    upstream: nickvasilescu/bot-hq
    into: packages/agents
    review: monthly
reference_only:                  # we port ideas, not code
  pandacode:
    upstream: aicodeking/pandacode
    ideas: [tauri-thin-shell, delta-coalescing, render-bench, account-pools, tiled-threads, quick-launcher, btw-threads, turn-checks]
  pandaos:
    upstream: aicodeking/pandaos
    ideas: [agent-user-isolation, cgroup-per-task, checkpoints, mcp-registry-projection, episode-log, cu-safety-defaults, boat-api]
  dsh-superagent-gui:
    upstream: aicodeking/dsh-superagent-gui
    ideas: [report-contract, accept-modes-observe-act, suggestions, comment-and-check-sources, ticket-stages, autonomy-matrix, worktree-or-copy]
  openclaw:
    upstream: openclaw/openclaw
    ideas: [soul-md, user-memory-files, daily-notes, dreaming, standing-intents, memory-provenance, channel-trust]
owned:
  local-memory:
    repo: ubermensch-site/Hermes-Agents-Local-Memory   # move into NeoMetaHarness org at P0
    lang: py
